# Lorenz ML-DA — batch training configuration for Main_ML.py
#
# All keys here map 1-to-1 with the sidebar of 1_SingleMLTraining.py.

dataset:
  system_type: '05'          # '63' (L63) | '96' (L96, N=40) | '05' (L05 Model III, N=480)
  dt: 0.001                  # integration time step
  ns: 10000                  # samples per start location (Ns)
  save_dt: 10                # subsampling factor  →  effective Δt = dt × save_dt
  std: 0.0                   # observation noise std  (0 = clean trajectories)
  prev_time_steps: 3         # history window size fed to the model
  num_start_locations: 3    # number of independent random-IC trajectories

  # Physics parameters — ignored for L63 (uses fixed σ=10/ρ=28/β=8/3)
  # L96:  {F: 8.0}
  # L05:  {F: 15.0, K: 32}
  system_params: {}

model:
  type: 'DenseNN'         # 'DenseNN' | 'ResDenseNN' | 'LSTMNN'
  hidden_layers: [128, 128, 64, 32]
  hidden_activation: 'ReLU'  # 'ReLU' | 'Tanh' | 'Sigmoid'
  output_activation: null

training:
  num_epochs: 5000
  batch_size: 2048
  learning_rate: 0.001
  n_trials: 1                # independent training runs (each saved separately)
  early_stopping_patience: 20
  loss_func: 'MSE'           # 'MSE' | 'Huber'
  split_train: 70            # % of dataset used for training
  split_val: 20              # % for validation  (remainder → test, not used in loop)
  split_test: 10

paths:
  outputs: 'outputs'         # full checkpoints (.pth) + configs (.yml) saved here
  models: 'models'           # (reserved for dashboard-trained models)
  runs: 'runs'               # TensorBoard logs
